
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 邀请码获取工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .button-group {
            text-align: center;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); }
        button:active { transform: translateY(0); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .info {
            text-align: center;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #0066cc;
        }
        .codes-container {
            max-height: 400px;
            overflow-y: auto;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
        }
        .code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .code-item {
            background: white;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .code-item:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .download-btn {
            margin-top: 20px;
            background: #10b981 !important;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 星光48邀请码获取工具</h1>
        
        <div class="button-group">
            <button id="getBtn" onclick="getAllCodes()">🚀 获取全部2000个邀请码</button>
        </div>

        <div id="info" class="info">
            点击上方按钮获取所有验证码！
        </div>

        <div id="stats" class="stats" style="display: none;"></div>

        <div id="codesContainer" class="codes-container" style="display: none;">
            <div id="codeGrid" class="code-grid"></div>
        </div>

        <div id="downloadSection" style="display: none; text-align: center;">
            <button class="download-btn" onclick="downloadCodes()">💾 下载所有验证码</button>
        </div>
    </div>

    <script>
        const API_URL = "https://kodai48-production.up.railway.app";
        let allCodes = [];

        async function getAllCodes() {
            const btn = document.getElementById('getBtn');
            const info = document.getElementById('info');
            
            btn.disabled = true;
            btn.textContent = "⏳ 正在获取...";
            info.textContent = "正在连接服务器，请稍候...";
            
            try {
                const statsRes = await fetch(`${API_URL}/api/invite/stats?password=admin48`);
                const stats = await statsRes.json();
                
                const codesRes = await fetch(`${API_URL}/api/invite/list?password=admin48&limit=2000`);
                const data = await codesRes.json();
                
                allCodes = data.codes;
                
                document.getElementById('stats').style.display = 'flex';
                document.getElementById('stats').innerHTML = `
                    <div class="stat-item">
                        <div class="stat-number">${stats.total}</div>
                        <div class="stat-label">总数量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${stats.unused}</div>
                        <div class="stat-label">可用</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${stats.used}</div>
                        <div class="stat-label">已用</div>
                    </div>
                `;
                
                const grid = document.getElementById('codeGrid');
                grid.innerHTML = allCodes.map((code, i) => 
                    `<div class="code-item" onclick="copyCode('${code}', this)" title="点击复制">${i+1}. ${code}</div>`
                ).join('');
                
                document.getElementById('codesContainer').style.display = 'block';
                document.getElementById('downloadSection').style.display = 'block';
                
                info.innerHTML = `✅ 成功获取 <strong>${allCodes.length}</strong> 个验证码！`;
                
            } catch (error) {
                info.innerHTML = `❌ 获取失败，请稍后再试！错误: ${error.message}`;
                console.error(error);
            }
            
            btn.disabled = false;
            btn.textContent = "🔄 重新获取";
        }

        function copyCode(code, element) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = element.textContent;
                element.textContent = "✅ 已复制!";
                element.style.background = "#10b981";
                element.style.color = "white";
                setTimeout(() => {
                    element.textContent = originalText;
                    element.style.background = "";
                    element.style.color = "";
                }, 1500);
            });
        }

        function downloadCodes() {
            const content = allCodes.join('\n');
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'all_invite_codes.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
