<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星光48·爱豆模拟器 V2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone-frame"><div class="phone-screen">
<div class="status-bar"><span class="time" id="statusTime">9:41</span><div class="icons"><span>📶</span><span>🔋</span></div></div>
<div class="screen-content">
<div id="phoneModals" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1000"></div>
<div class="invite-screen page active" id="inviteScreen">
    <div class="invite-title">🌟 星光48·爱豆模拟器</div>
    <div class="invite-subtitle">请输入邀请码解锁游戏</div>
    <input class="invite-input" id="inviteInput" placeholder="输入邀请码（如 PLAY48-xxxx）" onkeypress="if(event.key==='Enter')App.Invite.validate()">
    <button class="invite-btn" onclick="App.Invite.validate()">✨ 验证并进入</button>
    <div class="invite-error" id="inviteError"></div>
    <div class="invite-hint">如果没有邀请码，请联系管理员获取</div>
    <div class="invite-shop"><img src="/shop_card.jpg" alt="闲鱼店铺" style="width:100%;max-width:280px;border-radius:8px;margin-top:12px;"></div>
</div>
<div class="page lock-screen" id="lockScreen" onclick="App.UI.showPasswordScreen()"><div class="lock-time" id="lockTime">9:41</div><div class="lock-date" id="lockDate"></div><div class="lock-icon">⬆️ 点击解锁</div></div>
<div class="page password-screen" id="passwordScreen"><div class="password-title">输入密码解锁</div><div class="password-dots"><div class="password-dot" id="dot0"></div><div class="password-dot" id="dot1"></div><div class="password-dot" id="dot2"></div><div class="password-dot" id="dot3"></div></div><div class="password-keypad" id="passwordKeypad"></div><div class="password-error" id="passwordError"></div></div>
<div class="page create-screen" id="createScreen"><div class="create-content" id="createContent"></div></div>
<div class="page home-screen" id="homeScreen"><div style="text-align:center;padding:10px;font-size:12px;color:#999" id="gameTimeBar"></div><div class="home-grid" id="homeGrid"></div></div>
<div class="page" id="wechatPage" style="flex-direction:column"></div>
<div class="page" id="wechatChatPage" style="flex-direction:column"></div>
<div class="page" id="wechatMomentsPage" style="flex-direction:column"></div>
<div class="page" id="postMomentPage" style="flex-direction:column"></div>
<div class="page" id="wechatContactsPage" style="flex-direction:column"></div>
<div class="page" id="weiboPage" style="flex-direction:column"></div>
<div class="page" id="weiboCommentPage" style="flex-direction:column"></div>
<div class="page" id="smsPage" style="flex-direction:column"></div>
<div class="page" id="callPage" style="flex-direction:column"></div>
<div class="page" id="callChatPage" style="flex-direction:column;background:#1a1a2e;color:#fff"></div>
<div class="page" id="pocketPage" style="flex-direction:column"></div>
<div class="page" id="handshakePage" style="flex-direction:column"></div>
<div class="page" id="electionPage" style="flex-direction:column"></div>
<div class="page" id="outdoorPage" style="flex-direction:column"></div>
<div class="page" id="calendarPage" style="flex-direction:column"></div>
<div class="page" id="backpackPage" style="flex-direction:column"></div>
<div class="page" id="showEvalPage" style="flex-direction:column;justify-content:center;align-items:center"></div>
<div class="page" id="profilePage" style="flex-direction:column"></div>
        <div class="page" id="affectionPage" style="flex-direction:column"></div>
        <div class="page" id="diaryPage" style="flex-direction:column;background:#fdf8f0"></div>
        <div class="page" id="chatLeakPage" style="flex-direction:column;background:#1a1a1a;color:#fff"></div>
        <div class="page" id="settingsPage" style="flex-direction:column"></div>
        <!-- V4 新增页面 -->
        <div class="page" id="trainingPage" style="flex-direction:column"></div>
        <div class="page" id="stagePage" style="flex-direction:column"></div>
        <div class="page" id="externalPage" style="flex-direction:column"></div>
        <div class="page" id="healthPage" style="flex-direction:column"></div>
<div class="phone-notification" id="phoneNotifContainer"></div><div class="notification" id="notification"></div><div class="stat-change" id="statChange"></div><div class="event-modal" id="eventModal"><div class="event-card" id="eventCard"></div></div>
</div>
<div class="bottom-nav" id="bottomNav" style="display:none"><div class="nav-item active" onclick="App.UI.goHome()"><span class="nav-icon">🏠</span>主页</div><div class="nav-item" onclick="App.UI.openApp('wechat')"><span class="nav-icon">💬</span>微信</div><div class="nav-item" onclick="App.UI.openApp('pocket')"><span class="nav-icon">📱</span>口袋48</div><div class="nav-item" onclick="App.UI.openApp('profile')"><span class="nav-icon">👤</span>我的</div></div>
</div></div>
<audio id="soundMsg" preload="auto"></audio>
<audio id="soundCall" preload="auto"></audio>
<audio id="soundNotif" preload="auto"></audio>
<audio id="soundSuccess" preload="auto"></audio>
<audio id="soundError" preload="auto"></audio>
<audio id="soundClick" preload="auto"></audio>
<audio id="soundCheer" preload="auto"></audio>
<script src="app_diag.js?v=20260618g"></script>
<script src="app.js?v=20260618h"></script>
</body></html>
