<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>48模拟器 - AI聊天游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .content { padding: 30px; }
        .info-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .info-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .demo-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .demo-btn:hover { transform: scale(1.02); }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
        
        /* 聊天界面 */
        .chat-container {
            display: none;
            height: 400px;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f5f5f5;
            min-height: 300px;
        }
        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }
        .message.user {
            text-align: right;
            margin-left: auto;
        }
        .message.bot {
            text-align: left;
            margin-right: auto;
        }
        .message-content {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }
        .chat-input button {
            margin-left: 10px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 48模拟器</h1>
            <p>AI智能NPC对话体验</p>
        </div>
        
        <!-- 首页 -->
        <div class="content" id="home">
            <div class="info-box">
                <h3>✨ 功能特色</h3>
                <p>🎮 模拟偶像养成游戏</p>
                <p>💬 AI智能NPC实时对话</p>
                <p>🎭 多种角色性格设定</p>
                <p>📱 支持手机和电脑</p>
            </div>
            <button class="demo-btn" onclick="startChat()">
                🧪 开始AI对话体验
            </button>
        </div>
        
        <!-- 聊天界面 -->
        <div class="content chat-container" id="chat">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <div class="chat-messages" id="messages"></div>
            <div class="chat-input">
                <input type="text" id="inputMessage" placeholder="输入消息..." onkeyup="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
        
        <div class="footer">
            <p>Powered by DeepSeek AI</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://kodai48-production.up.railway.app/api/chat';
        
        const currentNPC = {
            id: '胡晓慧',
            type: 'sweet',
            name: '胡晓慧'
        };
        
        function goHome() {
            document.getElementById('home').style.display = 'block';
            document.getElementById('chat').style.display = 'none';
        }
        
        function startChat() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
            addMessage(`你好！我是${currentNPC.name}，很高兴认识你！`, 'bot');
        }
        
        function addMessage(content, type) {
            const messages = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.innerHTML = `<div class="message-content">${content}</div>`;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('inputMessage');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            input.value = '';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        npcId: currentNPC.id,
                        context: { npcType: currentNPC.type },
                        message: message
                    })
                });
                
                const data = await response.json();
                addMessage(data.reply, 'bot');
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('网络连接失败，请稍后重试。', 'bot');
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
